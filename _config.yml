# _config.yml
title: "Alexandre KABIL"
description: "Site statique généré par Jekyll. Modifications en cours"
url: "https://alexkabil.github.io"  # Remplacez par votre URL GitHub Pages
baseurl: "/testsitevibe"  # Nom du dépôt GitHub (ex: "/mon-site")

# Langues
languages: ["fr", "en"]
default_lang: "fr"

# Informations du chercheur
author:
  name: "Alexandre KABIL"
  email: "alexandre.kabil@---.fr"
  affiliation: "CNRS"
  orcid: "0000-0000-0000-0000"  # Exemple d'ORCID
  google_scholar: ""
  researchgate: ""

# Paramètres Jekyll
